<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calorie Search — Find the Lowest Calorie Products</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    .visually-hidden {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0);
      white-space: nowrap; border: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
      min-height: 100vh;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #e5e5e5;
      padding: 24px 16px;
      text-align: center;
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #111;
    }

    header p {
      margin-top: 6px;
      font-size: 0.9rem;
      color: #666;
    }

    .search-bar {
      display: flex;
      gap: 8px;
      max-width: 560px;
      margin: 28px auto 0;
      padding: 0 16px;
    }

    .search-bar input {
      flex: 1;
      padding: 12px 16px;
      font-size: 1rem;
      border: 1.5px solid #d1d5db;
      border-radius: 10px;
      outline: none;
      background: #fff;
      transition: border-color 0.15s;
    }

    .search-bar input:focus { border-color: #22c55e; }
    .search-bar input:disabled { background: #f3f4f6; }

    .search-bar button {
      padding: 12px 22px;
      font-size: 0.95rem;
      font-weight: 600;
      background: #22c55e;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }

    .search-bar button:hover { background: #16a34a; }
    .search-bar button:disabled { background: #86efac; cursor: not-allowed; }

    main {
      max-width: 900px;
      margin: 32px auto;
      padding: 0 16px;
    }

    .status {
      text-align: center;
      color: #666;
      font-size: 0.95rem;
      margin-bottom: 24px;
    }

    .spinner {
      display: none;
      width: 36px;
      height: 36px;
      border: 3px solid #e5e5e5;
      border-top-color: #22c55e;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 40px auto;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .results-label {
      font-size: 0.8rem;
      color: #888;
      margin-bottom: 14px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      border: 1px solid #e5e5e5;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: box-shadow 0.15s;
    }

    .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); }

    .card img {
      width: 100%;
      height: 160px;
      object-fit: contain;
      border-radius: 8px;
      background: #f9fafb;
    }

    .card-body { flex: 1; }

    .card-name {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.3;
      color: #111;
    }

    .card-brand {
      font-size: 0.8rem;
      color: #888;
      margin-top: 4px;
    }

    .calorie-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      align-self: flex-start;
    }

    .cal-low    { background: #dcfce7; color: #166534; }
    .cal-medium { background: #fef9c3; color: #854d0e; }
    .cal-high   { background: #fee2e2; color: #991b1b; }

    .empty, .error-msg {
      text-align: center;
      padding: 60px 16px;
      color: #888;
    }

    .error-msg { color: #dc2626; }

    .hint {
      text-align: center;
      padding: 60px 16px;
      color: #aaa;
      font-size: 0.95rem;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 16px;
    }

    .chip {
      padding: 6px 14px;
      font-size: 0.85rem;
      background: #f3f4f6;
      border: 1px solid #e5e5e5;
      border-radius: 20px;
      cursor: pointer;
      color: #444;
      transition: background 0.15s, border-color 0.15s;
    }

    .chip:hover { background: #e5e7eb; border-color: #d1d5db; }

    .retry-btn {
      margin-top: 12px;
      padding: 8px 20px;
      font-size: 0.9rem;
      font-weight: 600;
      background: #fff;
      color: #111;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .retry-btn:hover { background: #f3f4f6; }

    @media (max-width: 480px) {
      .search-bar { flex-direction: column; }
      .search-bar button { width: 100%; }
    }
  </style>
</head>
<body>

<header>
  <h1>Calorie Search</h1>
  <p>Find the lowest-calorie products for any food — sorted by kcal per 100g</p>
  <div class="search-bar">
    <label for="q" class="visually-hidden">Search for a food</label>
    <input id="q" type="search" placeholder="e.g. yogurt, chips, protein bar…" autocomplete="off" />
    <button id="btn">Search</button>
  </div>
  <div class="chips" id="chips">
    <button class="chip" data-q="yogurt">yogurt</button>
    <button class="chip" data-q="chips">chips</button>
    <button class="chip" data-q="cereal">cereal</button>
    <button class="chip" data-q="protein bar">protein bar</button>
    <button class="chip" data-q="bread">bread</button>
  </div>
</header>

<main>
  <div class="spinner" id="spinner"></div>
  <div id="status" class="status" aria-live="polite" aria-atomic="true"></div>
  <div id="results-label" class="results-label"></div>
  <div class="grid" id="grid"></div>
  <div class="hint" id="hint">Type a food name above to find the lowest-calorie options.</div>
</main>

<script>
  const input   = document.getElementById('q');
  const btn     = document.getElementById('btn');
  const spinner = document.getElementById('spinner');
  const status  = document.getElementById('status');
  const label   = document.getElementById('results-label');
  const grid    = document.getElementById('grid');
  const hint    = document.getElementById('hint');
  const chips   = document.getElementById('chips');

  const PLACEHOLDER = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="%23f3f4f6"/><text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" fill="%23d1d5db" font-size="32">🥫</text></svg>';

  let debounceTimer  = null;
  let currentQuery   = '';
  let currentAbort   = null;
  let lastQuery      = '';

  function makeCard(p) {
    const name   = p.product_name || 'Unknown product';
    const brand  = p.brands || '';
    const kcal   = p.nutriments['energy-kcal_100g'];
    const imgSrc = p.image_front_small_url || PLACEHOLDER;

    const card = document.createElement('div');
    card.className = 'card';

    const img = document.createElement('img');
    img.src = imgSrc;
    img.alt = name;
    img.loading = 'lazy';
    img.addEventListener('error', () => { img.src = PLACEHOLDER; });

    const body = document.createElement('div');
    body.className = 'card-body';

    const nameEl = document.createElement('div');
    nameEl.className = 'card-name';
    nameEl.textContent = name;
    body.appendChild(nameEl);

    if (brand) {
      const brandEl = document.createElement('div');
      brandEl.className = 'card-brand';
      brandEl.textContent = brand;
      body.appendChild(brandEl);
    }

    const cls = kcal < 100 ? 'cal-low' : kcal < 300 ? 'cal-medium' : 'cal-high';
    const badge = document.createElement('span');
    badge.className = `calorie-badge ${cls}`;
    badge.textContent = `${Math.round(kcal)} kcal / 100g`;

    card.appendChild(img);
    card.appendChild(body);
    card.appendChild(badge);
    return card;
  }

  function setLoading(on) {
    spinner.style.display = on ? 'block' : 'none';
    btn.disabled = on;
    if (on) {
      label.textContent = '';
      grid.innerHTML = '';
      status.textContent = '';
      hint.style.display = 'none';
      chips.style.display = 'none';
    }
  }

  async function search(q) {
    q = q.trim();
    if (!q) {
      currentQuery = '';
      label.textContent = '';
      grid.innerHTML = '';
      status.textContent = '';
      hint.style.display = '';
      chips.style.display = '';
      return;
    }

    currentQuery = q;
    lastQuery = q;

    if (currentAbort) currentAbort.abort();
    currentAbort = new AbortController();
    const signal = currentAbort.signal;

    setLoading(true);

    const url = new URL('https://world.openfoodfacts.org/api/v2/search');
    url.searchParams.set('q', q);
    url.searchParams.set('fields', 'product_name,brands,nutriments,image_front_small_url');
    url.searchParams.set('page_size', '60');

    try {
      const res = await fetch(url, { signal });

      if (!res.ok) throw new Error(`API error ${res.status}`);

      const data = await res.json();

      if (q !== currentQuery) return;

      const products = (data.products || [])
        .filter(p => p.nutriments && typeof p.nutriments['energy-kcal_100g'] === 'number')
        .sort((a, b) => a.nutriments['energy-kcal_100g'] - b.nutriments['energy-kcal_100g'])
        .slice(0, 20);

      setLoading(false);

      if (products.length === 0) {
        status.textContent = `No products with calorie data found for "${q}". Try a different search term.`;
        label.textContent = '';
        return;
      }

      label.textContent = `Showing ${products.length} results for "${q}" — sorted lowest to highest calories`;
      grid.innerHTML = '';
      products.forEach(p => grid.appendChild(makeCard(p)));

    } catch (err) {
      if (signal.aborted || q !== currentQuery) return;
      setLoading(false);

      const msg = document.createElement('span');
      msg.className = 'error-msg';
      msg.textContent = 'Could not reach the food database. Check your connection and try again.';

      const retryBtn = document.createElement('button');
      retryBtn.className = 'retry-btn';
      retryBtn.textContent = 'Try again';
      retryBtn.addEventListener('click', () => search(lastQuery));

      status.innerHTML = '';
      status.appendChild(msg);
      status.appendChild(document.createElement('br'));
      status.appendChild(retryBtn);
    }
  }

  btn.addEventListener('click', () => search(input.value));

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      clearTimeout(debounceTimer);
      search(input.value);
    }
  });

  input.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    const val = input.value.trim();
    if (val.length > 1) {
      debounceTimer = setTimeout(() => search(input.value), 400);
    } else if (val.length === 0) {
      search('');
    }
  });

  chips.addEventListener('click', e => {
    const chip = e.target.closest('[data-q]');
    if (!chip) return;
    const q = chip.dataset.q;
    input.value = q;
    search(q);
  });
</script>
</body>
</html>
